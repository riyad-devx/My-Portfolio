<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="crudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#crudBg)" />

  <!-- Code/Data Grid lines -->
  <g stroke="#374151" stroke-width="1" opacity="0.12">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Main Window -->
  <g transform="translate(60, 40)" filter="url(#shadowBox)">
    <!-- Window Frame -->
    <rect width="680" height="420" rx="16" fill="#0f172a" stroke="#1f2937" stroke-width="1.5" />
    <rect width="680" height="44" rx="16" fill="#111827" />
    <rect y="34" width="680" height="10" fill="#111827" />
    <line x1="0" y1="44" x2="680" y2="44" stroke="#1f2937" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="22" r="6" fill="#ef4444" />
    <circle cx="48" cy="22" r="6" fill="#eab308" />
    <circle cx="68" cy="22" r="6" fill="#22c55e" />

    <text x="340" y="26" text-anchor="middle" font-family="monospace" font-size="12" fill="#9ca3af">User Management CRUD Dashboard</text>

    <!-- Header Actions -->
    <g transform="translate(30, 65)">
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f9fafb">Users Directory</text>
      <text x="0" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Full-Stack Next.js + Express + MongoDB Architecture</text>

      <!-- Search input mockup -->
      <rect x="360" y="10" width="140" height="32" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="375" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Search users...</text>

      <!-- Add New User CTA -->
      <rect x="510" y="10" width="110" height="32" rx="8" fill="url(#purpleGradient)" />
      <text x="565" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">+ Add User</text>
    </g>

    <!-- Table Header -->
    <g transform="translate(30, 130)">
      <rect width="620" height="36" rx="8" fill="#1e293b" />
      <text x="24" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">USER</text>
      <text x="200" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">ROLE</text>
      <text x="320" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">STATUS</text>
      <text x="440" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">DATABASE</text>
      <text x="550" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">ACTIONS</text>

      <!-- Row 1 -->
      <g transform="translate(0, 48)">
        <circle cx="36" cy="16" r="14" fill="#6366f1" />
        <text x="36" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">RM</text>
        <text x="62" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Riyad Mia</text>
        <text x="62" y="27" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">riyad@example.com</text>

        <rect x="195" y="5" width="60" height="20" rx="4" fill="#312e81" />
        <text x="225" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#c7d2fe">Admin</text>

        <rect x="315" y="5" width="55" height="20" rx="10" fill="#064e3b" />
        <text x="342" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#34d399">Active</text>

        <text x="440" y="20" font-family="monospace" font-size="11" fill="#10b981">MongoDB</text>

        <!-- Actions -->
        <rect x="540" y="5" width="28" height="22" rx="4" fill="#1e293b" />
        <text x="554" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">✎</text>
        <rect x="575" y="5" width="28" height="22" rx="4" fill="#1e293b" />
        <text x="589" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e">🗑</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 96)">
        <circle cx="36" cy="16" r="14" fill="#0ea5e9" />
        <text x="36" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">TA</text>
        <text x="62" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Tanvir Ahmed</text>
        <text x="62" y="27" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">tanvir@example.com</text>

        <rect x="195" y="5" width="60" height="20" rx="4" fill="#1e293b" />
        <text x="225" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Developer</text>

        <rect x="315" y="5" width="55" height="20" rx="10" fill="#064e3b" />
        <text x="342" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#34d399">Active</text>

        <text x="440" y="20" font-family="monospace" font-size="11" fill="#10b981">MongoDB</text>

        <rect x="540" y="5" width="28" height="22" rx="4" fill="#1e293b" />
        <text x="554" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">✎</text>
        <rect x="575" y="5" width="28" height="22" rx="4" fill="#1e293b" />
        <text x="589" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e">🗑</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 144)">
        <circle cx="36" cy="16" r="14" fill="#10b981" />
        <text x="36" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">NH</text>
        <text x="62" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Naim Hasan</text>
        <text x="62" y="27" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">naim@example.com</text>

        <rect x="195" y="5" width="60" height="20" rx="4" fill="#1e293b" />
        <text x="225" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">User</text>

        <rect x="315" y="5" width="55" height="20" rx="10" fill="#451a03" />
        <text x="342" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f59e0b">Pending</text>

        <text x="440" y="20" font-family="monospace" font-size="11" fill="#10b981">MongoDB</text>

        <rect x="540" y="5" width="28" height="22" rx="4" fill="#1e293b" />
        <text x="554" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">✎</text>
        <rect x="575" y="5" width="28" height="22" rx="4" fill="#1e293b" />
        <text x="589" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e">🗑</text>
      </g>
    </g>

    <!-- Badge info footer inside mockup -->
    <g transform="translate(30, 360)">
      <rect x="0" y="0" width="620" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="15" y="20" font-family="monospace" font-size="10.5" fill="#a78bfa">POST /api/users</text>
      <text x="150" y="20" font-family="monospace" font-size="10.5" fill="#38bdf8">GET /api/users/:id</text>
      <text x="310" y="20" font-family="monospace" font-size="10.5" fill="#34d399">PUT /api/users/:id</text>
      <text x="470" y="20" font-family="monospace" font-size="10.5" fill="#f87171">DELETE /api/users/:id</text>
    </g>
  </g>
</svg>
