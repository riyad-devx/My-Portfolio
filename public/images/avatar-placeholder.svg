<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Outer ambient glow ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Glowing center aura -->
  <circle cx="200" cy="180" r="110" fill="url(#glowGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Developer Silhouette / Avatar Representation -->
  <g transform="translate(0, 10)">
    <!-- Head/Hair -->
    <ellipse cx="200" cy="140" rx="55" ry="60" fill="#1e293b" stroke="url(#glowGrad)" stroke-width="3" />
    <!-- Facial silhouette area -->
    <ellipse cx="200" cy="150" rx="42" ry="46" fill="#334155" />
    <!-- Modern Glasses -->
    <rect x="168" y="138" width="26" height="18" rx="5" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" />
    <rect x="206" y="138" width="26" height="18" rx="5" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" />
    <line x1="194" y1="147" x2="206" y2="147" stroke="#a855f7" stroke-width="2.5" />
    <!-- Friendly smile -->
    <path d="M 188 175 Q 200 186 212 175" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Torso / Hoodie -->
    <path d="M 115 310 C 120 235 155 220 200 220 C 245 220 280 235 285 310 Z" fill="#1e293b" stroke="url(#glowGrad)" stroke-width="3" />
    <!-- Inner Hoodie collar & drawstrings -->
    <path d="M 175 225 L 200 265 L 225 225" fill="#0f172a" stroke="#475569" stroke-width="2" />
    
    <!-- Monogram Initials Badge -->
    <circle cx="200" cy="275" r="22" fill="#0b0f19" stroke="url(#glowGrad)" stroke-width="2" />
    <text x="200" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="1">RM</text>
  </g>

  <!-- Code Elements Floating -->
  <g opacity="0.85">
    <!-- Left Code Tag -->
    <rect x="42" y="150" width="60" height="32" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="72" y="171" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#a78bfa">&lt;/&gt;</text>

    <!-- Right JS / React Tag -->
    <rect x="298" y="150" width="60" height="32" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
    <text x="328" y="171" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">JSX</text>

    <!-- Bottom Status Pill -->
    <rect x="110" y="340" width="180" height="32" rx="16" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="128" cy="356" r="4.5" fill="#22c55e" />
    <text x="140" y="361" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Available for Opportunities</text>
  </g>
</svg>
