<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#141829" />
    </linearGradient>
    <linearGradient id="fitAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="fitShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#fitBg)" />

  <!-- Background subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.25">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Window Container -->
  <g transform="translate(60, 40)" filter="url(#fitShadow)">
    <rect width="680" height="420" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect width="680" height="44" rx="16" fill="#0b0f19" />
    <rect y="34" width="680" height="10" fill="#0b0f19" />
    <line x1="0" y1="44" x2="680" y2="44" stroke="#1e293b" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="22" r="6" fill="#ef4444" />
    <circle cx="48" cy="22" r="6" fill="#eab308" />
    <circle cx="68" cy="22" r="6" fill="#22c55e" />

    <text x="340" y="27" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">FitLog – Workout &amp; Fitness Routine Tracker</text>

    <!-- Top Bar inside mockup -->
    <g transform="translate(30, 65)">
      <circle cx="18" cy="18" r="18" fill="url(#fitAccent)" />
      <text x="18" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">⚡</text>
      <text x="48" y="22" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">FitLog <tspan fill="#a855f7" font-size="14">Tracker</tspan></text>
      <text x="48" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Smart workout logging, set progression &amp; streak tracking</text>

      <!-- Streak Pill -->
      <rect x="490" y="8" width="130" height="28" rx="14" fill="#3b0764" stroke="#9333ea" stroke-width="1" />
      <text x="555" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e9d5ff">🔥 14-Day Streak</text>
    </g>

    <!-- Stat Metric Cards -->
    <g transform="translate(30, 130)">
      <!-- Card 1: Today's Routine -->
      <rect x="0" y="0" width="190" height="95" rx="10" fill="#141a29" stroke="#1e293b" stroke-width="1.5" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a855f7">TODAY'S WORKOUT</text>
      <text x="16" y="48" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Push Day (Chest/Triceps)</text>
      <text x="16" y="74" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8">5 Exercises • 18 Total Sets</text>

      <!-- Card 2: Volume -->
      <rect x="215" y="0" width="190" height="95" rx="10" fill="#141a29" stroke="#1e293b" stroke-width="1.5" />
      <text x="231" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#06b6d4">WEEKLY VOLUME</text>
      <text x="231" y="52" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">14,250 <tspan font-size="13" font-weight="500">kg</tspan></text>
      <text x="231" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#4ade80">↑ 8% vs last week</text>

      <!-- Card 3: Consistency -->
      <rect x="430" y="0" width="190" height="95" rx="10" fill="#141a29" stroke="#1e293b" stroke-width="1.5" />
      <text x="446" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ec4899">COMPLETED SESSIONS</text>
      <text x="446" y="52" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#f43f5e">4 <tspan font-size="14" fill="#94a3b8">/ 5 days</tspan></text>
      <text x="446" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">Target: 5 sessions/wk</text>
    </g>

    <!-- Workout Exercise Log Mockup -->
    <g transform="translate(30, 245)">
      <rect width="620" height="135" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
      
      <!-- Section Title -->
      <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f9fafb">Barbell Bench Press</text>
      <text x="530" y="26" text-anchor="end" font-family="monospace" font-size="11" fill="#10b981">✓ Completed</text>

      <!-- Sets Table inside exercise -->
      <line x1="20" y1="38" x2="600" y2="38" stroke="#1f2937" stroke-width="1" />

      <text x="40" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">Set 1</text>
      <text x="140" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f3f4f6">60 kg × 12 reps</text>
      <text x="480" y="58" font-family="monospace" font-size="11" fill="#a78bfa">Warmup</text>

      <text x="40" y="84" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">Set 2</text>
      <text x="140" y="84" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f3f4f6">75 kg × 8 reps</text>
      <text x="480" y="84" font-family="monospace" font-size="11" fill="#38bdf8">Working</text>

      <text x="40" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">Set 3</text>
      <text x="140" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">80 kg × 6 reps</text>
      <text x="480" y="110" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">⭐ Personal Best</text>
    </g>
  </g>
</svg>
